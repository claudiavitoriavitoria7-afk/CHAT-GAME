<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NeonChat // Sala Criptografada</title>
  <style>
    :root {
      --bg-main: #070908;
      --bg-panel: #0e1411;
      --bg-input: #131c17;
      --neon: #00ff66;
      --neon-dim: rgba(0, 255, 102, 0.18);
      --neon-glow: 0 0 12px rgba(0, 255, 102, 0.35);
      --text: #e6fff0;
      --muted: #7da38c;
      --danger: #ff3b5c;
      --danger-bg: rgba(255, 59, 92, 0.14);
      --border: #1d3326;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: "Courier New", Courier, monospace;
    }

    body {
      background-color: var(--bg-main);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .container {
      width: 100%;
      max-width: 780px;
      background: var(--bg-panel);
      border: 1px solid var(--border);
      border-radius: 10px;
      box-shadow: 0 0 30px rgba(0, 255, 102, 0.08);
      overflow: hidden;
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 14px 18px;
      background: #090d0b;
      border-bottom: 1px solid var(--border);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--neon);
      font-weight: bold;
      font-size: 1rem;
      text-shadow: var(--neon-glow);
    }

    .dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--neon);
      box-shadow: var(--neon-glow);
    }

    .room-info {
      font-size: 0.8rem;
      color: var(--muted);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .btn {
      background: transparent;
      color: var(--neon);
      border: 1px solid var(--neon);
      padding: 9px 14px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      transition: 0.15s ease;
    }

    .btn:hover {
      background: var(--neon);
      color: #050806;
      box-shadow: var(--neon-glow);
    }

    .btn-sm {
      padding: 5px 10px;
      font-size: 0.78rem;
    }

    .btn-danger {
      color: var(--danger);
      border-color: var(--danger);
    }

    .btn-danger:hover {
      background: var(--danger);
      color: #fff;
      box-shadow: 0 0 10px rgba(255, 59, 92, 0.4);
    }

    /* Tela de Login */
    #login-screen {
      padding: 28px 22px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    #login-screen h2 {
      color: var(--neon);
      font-size: 1.2rem;
    }

    #login-screen p {
      color: var(--muted);
      font-size: 0.88rem;
      line-height: 1.4;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    label {
      font-size: 0.82rem;
      color: var(--neon);
    }

    input[type="text"],
    input[type="password"] {
      width: 100%;
      padding: 11px 12px;
      background: var(--bg-input);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      font-size: 0.95rem;
      outline: none;
    }

    input:focus {
      border-color: var(--neon);
      box-shadow: 0 0 0 2px var(--neon-dim);
    }

    /* Tela de Chat */
    #chat-screen {
      display: none;
      flex-direction: column;
      height: 76vh;
      min-height: 460px;
    }

    #messages-box {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .msg-card {
      background: var(--bg-input);
      border: 1px solid var(--border);
      border-left: 3px solid var(--neon);
      border-radius: 6px;
      padding: 10px 12px;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
    }

    .msg-card.reported {
      border-left-color: var(--danger);
      background: var(--danger-bg);
    }

    .msg-meta {
      font-size: 0.75rem;
      color: var(--muted);
      margin-bottom: 4px;
    }

    .msg-user {
      color: var(--neon);
      font-weight: bold;
    }

    .msg-text {
      font-size: 0.95rem;
      word-break: break-word;
      line-height: 1.35;
    }

    .badge-reported {
      display: inline-block;
      margin-top: 6px;
      font-size: 0.72rem;
      color: var(--danger);
      font-weight: bold;
    }

      margin: 0 16px 10px;
      padding:
